<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eaglercraft Embed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Overlay button to trigger pointer lock via user interaction */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .overlay h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px #000;
    }
    .overlay p {
      font-size: 1.2rem;
      background: #555;
      padding: 10px 20px;
      border-radius: 5px;
      border: 2px solid #888;
    }
    .overlay.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container" id="gameContainer">
    <!-- Click overlay to satisfy browser user-gesture requirements for Pointer Lock -->
    <div class="overlay" id="clickOverlay">
      <h1>Click Anywhere to Play</h1>
      <p>Enables Pointer Lock / Mouse Control</p>
    </div>

    <!-- Embedded website with permission attributes allowing pointer-lock -->
    <iframe 
      id="gameFrame"
      src="https://eglerkraft.vercel.app/" 
      allow="autoplay; fullscreen; pointer-lock" 
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"
      title="Eaglercraft">
    </iframe>
  </div>

  <script>
    const overlay = document.getElementById('clickOverlay');
    const iframe = document.getElementById('gameFrame');

    overlay.addEventListener('click', () => {
      // Hide overlay so the user can interact directly with the iframe
      overlay.classList.add('hidden');

      // Request Pointer Lock on iframe container if needed
      if (iframe.requestPointerLock) {
        iframe.requestPointerLock();
      }
      
      // Focus the iframe so controls register immediately
      iframe.focus();
    });
  </script>

</body>
</html>
